<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7cff" />
      <stop offset="100%" stop-color="#3fd68c" />
    </linearGradient>
  </defs>

  <!-- Vibrant brand-gradient tile so the icon stays visible on both dark and
       light taskbars/menus (a near-black tile disappears on dark backgrounds). -->
  <rect width="512" height="512" rx="112" fill="url(#tile)" />

  <!-- compass rings, white for contrast on the colored tile -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <!-- cardinal ticks -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="92" x2="256" y2="128" />
    <line x1="256" y1="384" x2="256" y2="420" />
    <line x1="92" y1="256" x2="128" y2="256" />
    <line x1="384" y1="256" x2="420" y2="256" />
  </g>

  <!-- compass needle pointing true north -->
  <polygon points="256,120 282,256 256,240 230,256" fill="#ffffff" />
  <polygon points="256,392 230,256 256,272 282,256" fill="#ffffff" fill-opacity="0.4" />

  <!-- center pin -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  <circle cx="256" cy="256" r="7" fill="#2f6fef" />
</svg>
